<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vui Học Movers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap&subset=vietnamese">
<style>
/* Bố cục: trang vở ô li — lưới ô vuông, lề hồng bên trái, thẻ bài như nhãn dán */
:root{
  --paper:#fbfaf4; --grid:rgba(70,100,210,.10); --grid2:rgba(70,100,210,.045); --margin:rgba(226,86,120,.38);
  --ink:#1f2b6b; --ink2:#59638f; --card:#ffffff; --line:#dbe0f0; --chip:#eef0fa;
  --sun:#ffc531; --sun-ink:#4a3200; --tomato:#ee5a3a; --leaf:#1f9e5f; --sky:#2f74e8; --grape:#7d4ce8;
  --right:#1f9e5f; --right-bg:#e3f7ec; --wrong:#df3d45; --wrong-bg:#fde6e7; --shadow:rgba(31,43,107,.16);
  --f-display:'Baloo 2','Comic Sans MS',system-ui,sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16241e; --grid:rgba(255,255,255,.06); --grid2:rgba(255,255,255,.025); --margin:rgba(255,130,160,.28);
  --ink:#eef5ec; --ink2:#a8bcb0; --card:#1f3129; --line:#34493f; --chip:#293d34;
  --sun:#ffd257; --sun-ink:#3a2700; --tomato:#ff7f61; --leaf:#4fd18b; --sky:#6ea8ff; --grape:#b190ff;
  --right:#4fd18b; --right-bg:#1d4632; --wrong:#ff6d72; --wrong-bg:#4a2326; --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16241e; --grid:rgba(255,255,255,.06); --grid2:rgba(255,255,255,.025); --margin:rgba(255,130,160,.28);
  --ink:#eef5ec; --ink2:#a8bcb0; --card:#1f3129; --line:#34493f; --chip:#293d34;
  --sun:#ffd257; --sun-ink:#3a2700; --tomato:#ff7f61; --leaf:#4fd18b; --sky:#6ea8ff; --grape:#b190ff;
  --right:#4fd18b; --right-bg:#1d4632; --wrong:#ff6d72; --wrong-bg:#4a2326; --shadow:rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{
  font:500 16px/1.5 var(--f-body); color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid2) 1px,transparent 1px);
  background-size:32px 32px,32px 32px,8px 8px;
  min-height:100vh;
}
body::before{content:"";position:fixed;top:0;bottom:0;left:44px;width:2px;background:var(--margin);pointer-events:none;z-index:0}
@media (max-width:700px){body::before{display:none}}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
@media (min-width:701px){.wrap{padding-left:72px}}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}

/* Header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:18px 10px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;margin-right:auto}
.logo{width:48px;height:48px;border-radius:14px;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font:800 26px var(--f-display);border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);transform:rotate(-4deg)}
.brand h1{font-size:1.7rem;font-weight:800}
.brand small{display:block;font:700 .78rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.stat{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-variant-numeric:tabular-nums}

/* Tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px;border-bottom:2px dashed var(--line);padding-bottom:12px}
.tab{border:2px solid transparent;background:none;padding:8px 14px;border-radius:12px;font-weight:800;font-size:1rem;cursor:pointer;color:var(--ink2)}
.tab.on{background:var(--card);border-color:var(--ink);color:var(--ink);box-shadow:0 3px 0 var(--ink)}

/* Buttons */
.btn{font:800 1rem var(--f-body);border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:14px;padding:.55rem 1rem;box-shadow:0 3px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--sun);color:var(--sun-ink)}
.btn.small{font-size:.88rem;padding:.35rem .7rem;border-radius:10px}
.btn.ghost{border-color:var(--line);box-shadow:0 3px 0 var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{justify-content:center;text-align:center}

/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.pill{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:800;cursor:pointer;font-size:.9rem}
.pill.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
input[type=search],input[type=text],select,textarea{font:600 1rem var(--f-body);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--sky);outline:none}

/* Level badges */
.lv{font:800 .72rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:2px solid currentColor;white-space:nowrap}
.lv-S{color:var(--leaf)} .lv-M{color:var(--sky)} .lv-F{color:var(--grape)}

/* Continue banner */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:18px 20px;box-shadow:0 5px 0 var(--ink);margin-bottom:22px}
.hero h2{font-size:1.5rem}
.hero p{margin:4px 0 0;color:var(--ink2)}
.hero .ems{font-size:2.6rem;letter-spacing:4px}
@media (max-width:620px){.hero{grid-template-columns:1fr}.hero .ems{font-size:2rem}}

/* Lesson grid */
.sec-title{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.sec-title h2{font-size:1.35rem}
.sec-title span{color:var(--ink2);font-weight:700;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.lcard{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:6px;cursor:pointer;transition:transform .12s,border-color .12s}
.lcard:hover{border-color:var(--ink);transform:translateY(-2px)}
.lcard .num{font:800 .8rem var(--f-body);color:var(--ink2);display:flex;justify-content:space-between;align-items:center;gap:6px}
.lcard .ems{font-size:1.6rem;letter-spacing:2px;min-height:2.2rem;white-space:nowrap;overflow:hidden}
.lcard h3{font-size:1.08rem}
.lcard .stars{font-size:.95rem;letter-spacing:1px}
.lcard.kind-grammar{border-style:dashed}
.lcard.kind-review{background:linear-gradient(135deg,var(--card) 70%,var(--chip))}
.star-off{filter:grayscale(1);opacity:.3}
.empty{padding:28px;text-align:center;color:var(--ink2);border:2px dashed var(--line);border-radius:var(--r)}

/* Lesson screen */
.lhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 16px}
.lhead h2{font-size:1.8rem}
.lhead .meta{color:var(--ink2);font-weight:700}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.wcard{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;cursor:pointer;display:grid;gap:2px}
.wcard:hover{border-color:var(--sky)}
.wcard .em{font-size:2.1rem;line-height:1.2}
.wcard b{font:800 1.1rem var(--f-display)}
.wcard span{color:var(--ink2);font-size:.88rem}
.sents{display:grid;gap:8px}
.sent{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.sent .t{min-width:0}
.sent b{display:block;font-weight:800}
.sent span{color:var(--ink2);font-size:.92rem}
.formula{background:var(--sun);color:var(--sun-ink);border:2px solid var(--ink);border-radius:14px;padding:10px 14px;font:800 1.05rem var(--f-display);box-shadow:0 3px 0 var(--ink)}
.ggroup{margin-top:20px}
.ggroup h3{font-size:1.15rem;margin-bottom:8px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.gtile{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:12px;text-align:left;cursor:pointer;box-shadow:0 3px 0 var(--ink);display:grid;gap:2px;transition:transform .08s}
.gtile:hover{transform:translateY(-2px)}
.gtile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.gtile .ic{font-size:1.9rem}
.gtile b{font:800 1.02rem var(--f-display)}
.gtile small{color:var(--ink2);font-size:.82rem;line-height:1.3}
.gtile .gs{font-size:.8rem;margin-top:2px}

/* Game screen */
.gbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.gbar h2{font-size:1.35rem;margin-right:auto}
.prog{flex-basis:100%;height:12px;background:var(--chip);border-radius:99px;overflow:hidden;border:2px solid var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--leaf);border-radius:99px;transition:width .3s}
.score{font:800 1.1rem var(--f-display);font-variant-numeric:tabular-nums;background:var(--card);border:2px solid var(--line);padding:2px 12px;border-radius:999px}
#gameArea{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:20px;box-shadow:0 5px 0 var(--ink);min-height:360px;position:relative;overflow:hidden}
@media (max-width:520px){#gameArea{padding:14px}}
.prompt{text-align:center;display:grid;gap:4px;justify-items:center;margin-bottom:14px}
.prompt .big{font:800 clamp(2rem,6vw,3rem) var(--f-display);line-height:1.1;overflow-wrap:anywhere}
.prompt .em{font-size:clamp(3.2rem,10vw,4.6rem);line-height:1.1}
.prompt .vi{color:var(--ink2);font-weight:800;font-size:1.1rem}
.prompt .sen{font:700 clamp(1.2rem,3.6vw,1.6rem) var(--f-display);max-width:44rem}
.hint{color:var(--ink2);text-align:center;margin:0 0 10px;font-weight:700}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:640px;margin:0 auto}
.choices.one{grid-template-columns:1fr}
.choice{min-height:64px;font:800 1.15rem var(--f-body);background:var(--paper);border:2px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);cursor:pointer;padding:8px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow-wrap:anywhere}
.choice .em{font-size:2rem;line-height:1.1}
.choice small{font-size:.85rem;color:var(--ink2)}
.choice:active{transform:translateY(3px);box-shadow:none}
.choice.right{background:var(--right-bg);border-color:var(--right);box-shadow:0 3px 0 var(--right)}
.choice.wrong{background:var(--wrong-bg);border-color:var(--wrong);box-shadow:0 3px 0 var(--wrong);animation:shake .35s}
.choice.sentc{font-size:1rem;font-weight:700;text-align:center}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .35s}
.feedback{text-align:center;font:800 1.15rem var(--f-display);min-height:1.6em;margin-top:10px}
.feedback.ok{color:var(--right)} .feedback.no{color:var(--wrong)}
.speaker{width:72px;height:72px;border-radius:50%;font-size:2rem;border:2px solid var(--ink);background:var(--sun);box-shadow:0 4px 0 var(--ink);cursor:pointer}
.speaker:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* Flashcard */
.flash{max-width:420px;margin:0 auto;background:var(--paper);border:2px solid var(--ink);border-radius:22px;padding:22px;text-align:center;display:grid;gap:4px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.flash .fem{font-size:5rem;line-height:1.1}
.flash .fen{font:800 2.4rem var(--f-display)}
.flash .fvi{font-weight:800;font-size:1.25rem;color:var(--sky)}
.flash:not(.flip) .fvi{visibility:hidden}
.flash .tip{font-size:.85rem;color:var(--ink2)}

/* Mic */
.mic{display:grid;gap:8px;justify-items:center;margin:16px auto 0;max-width:560px;background:var(--chip);border-radius:16px;padding:12px}
.mic-btn{background:var(--tomato);color:#fff;border-color:var(--ink);font-size:1.05rem}
.mic-btn.on{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.mic-res{text-align:center;font-weight:700;min-height:1.4em}
.mic-res .st{font-size:1.6rem;display:block}

/* Memory */
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:620px;margin:0 auto}
@media (max-width:480px){.mem{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mc{aspect-ratio:1/1;max-width:100%;border:2px solid var(--ink);border-radius:14px;background:var(--sky);color:#fff;font:800 1.9rem var(--f-display);cursor:pointer;display:grid;place-items:center;padding:4px;box-shadow:0 3px 0 var(--ink);overflow:hidden}
.mc.open,.mc.done{background:var(--paper);color:var(--ink)}
.mc.done{border-color:var(--right);box-shadow:0 3px 0 var(--right);opacity:.75}
.mc .t{font-size:clamp(.8rem,2.6vw,1.1rem);overflow-wrap:anywhere;line-height:1.15}
.mc .e{font-size:2.2rem}

/* Match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:640px;margin:0 auto}
.mcol{display:grid;gap:8px;align-content:start}
.mitem{min-height:52px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);font:800 1rem var(--f-body);cursor:pointer;padding:6px 8px;box-shadow:0 3px 0 var(--ink);overflow-wrap:anywhere}
.mitem.sel{background:var(--sun);color:var(--sun-ink)}
.mitem.done{background:var(--right-bg);border-color:var(--right);box-shadow:none;opacity:.6;cursor:default}

/* Tiles (unscramble / sentence) */
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.slot{width:46px;height:54px;border-bottom:4px solid var(--ink);display:grid;place-items:center;font:800 1.7rem var(--f-display);cursor:pointer;background:var(--chip);border-radius:10px 10px 4px 4px}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tile{min-width:48px;height:52px;border:2px solid var(--ink);border-radius:12px;background:var(--sun);color:var(--sun-ink);font:800 1.5rem var(--f-display);cursor:pointer;box-shadow:0 3px 0 var(--ink);padding:0 10px}
.tile.w{font:800 1.05rem var(--f-body);height:auto;min-height:46px}
.tile.used{visibility:hidden}
.answer{min-height:64px;border:2px dashed var(--ink2);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:10px 0}
.answer.ok{border-color:var(--right);background:var(--right-bg)}
.answer.no{border-color:var(--wrong);background:var(--wrong-bg)}
.mword{font:800 clamp(1.8rem,6vw,2.6rem) var(--f-display);letter-spacing:.12em;text-align:center;overflow-wrap:anywhere}
.mword .blank{color:var(--tomato);border-bottom:4px solid var(--tomato);padding:0 .1em}

/* Bubbles */
.field{position:relative;height:380px;border-radius:16px;background:linear-gradient(var(--chip),var(--paper));overflow:hidden;border:2px solid var(--line)}
.bubble{position:absolute;bottom:-90px;width:110px;height:110px;border-radius:50%;display:grid;place-items:center;text-align:center;padding:8px;font:800 1rem var(--f-body);color:var(--ink);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(120,180,255,.35) 60%,rgba(47,116,232,.35));border:2px solid var(--sky);cursor:pointer;animation:rise linear forwards;overflow-wrap:anywhere;line-height:1.1}
.bubble.bad{background:var(--wrong-bg);border-color:var(--wrong)}
.bubble.pop{animation:pop .3s forwards!important}
@keyframes rise{to{transform:translateY(-500px)}}
@keyframes pop{to{transform:scale(1.6);opacity:0}}

/* Whack */
.holes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:520px;margin:0 auto}
.hole{height:96px;border-radius:50% 50% 16px 16px;background:var(--chip);border:2px solid var(--line);position:relative;overflow:hidden}
.mole{position:absolute;inset:auto 8px 0 8px;height:84px;border-radius:40px 40px 10px 10px;background:var(--sun);color:var(--sun-ink);border:2px solid var(--ink);display:grid;place-items:center;font:800 .95rem var(--f-body);cursor:pointer;transform:translateY(100%);transition:transform .18s;padding:4px;overflow-wrap:anywhere;text-align:center;line-height:1.1}
.mole.up{transform:translateY(8px)}
.mole.hit{background:var(--right-bg);border-color:var(--right)}
.mole.miss{background:var(--wrong-bg);border-color:var(--wrong)}

/* Apple tree */
.tree{font-size:2rem;text-align:center;letter-spacing:4px;min-height:2.6rem}
.tree .fall{display:inline-block;animation:fall .7s forwards}
@keyframes fall{to{transform:translateY(60px) rotate(90deg);opacity:0}}
.kb{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;max-width:560px;margin:12px auto 0}
.key{height:44px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);font:800 1.1rem var(--f-display);cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.key:disabled{opacity:.35;cursor:default}
.key.good{background:var(--right-bg);border-color:var(--right)}

/* Word search */
.wsbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start;justify-content:center}
@media (max-width:640px){.wsbox{grid-template-columns:1fr}}
.wsgrid{display:grid;gap:3px;justify-self:center}
.wscell{width:clamp(28px,8vw,40px);height:clamp(28px,8vw,40px);border:1.5px solid var(--line);border-radius:8px;background:var(--paper);font:800 clamp(.95rem,3vw,1.25rem) var(--f-display);cursor:pointer;display:grid;place-items:center;padding:0}
.wscell.sel{background:var(--sun);color:var(--sun-ink)}
.wscell.found{background:var(--right-bg);border-color:var(--right)}
.wslist{display:grid;gap:6px}
.wslist div{font-weight:800;padding:4px 10px;border-radius:10px;background:var(--chip)}
.wslist div.found{text-decoration:line-through;color:var(--right)}

/* Mystery */
.mystery{font-size:6rem;text-align:center;transition:filter .1s linear;line-height:1.2;user-select:none}

/* End screen */
.end{text-align:center;display:grid;gap:10px;justify-items:center;padding:20px 0}
.end .bigstars{font-size:3.4rem;letter-spacing:6px}
.end h2{font-size:2rem}
.end p{color:var(--ink2);font-weight:700;margin:0}

/* Dictionary & studio & me */
.dict{display:grid;gap:4px}
.drow{display:grid;grid-template-columns:2.4rem minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer}
.drow:hover{border-color:var(--sky)}
.drow .em{font-size:1.5rem;text-align:center}
.drow b{font-weight:800}
.drow span{color:var(--ink2)}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:18px;box-shadow:0 4px 0 var(--ink);margin-bottom:18px}
.panel h2{font-size:1.35rem;margin-bottom:8px}
.recs{display:grid;gap:8px}
.rec{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px}
.rec .t{flex:1 1 220px;min-width:0;font-weight:800}
.rec small{color:var(--ink2);display:block;font-weight:600}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sbox{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.sbox b{display:block;font:800 2rem var(--f-display);font-variant-numeric:tabular-nums}
.sbox span{color:var(--ink2);font-weight:700;font-size:.9rem}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{display:grid;justify-items:center;gap:2px;width:110px;text-align:center;padding:10px 6px;border-radius:14px;background:var(--paper);border:2px solid var(--line);font-weight:800;font-size:.82rem}

{lv:"M",t:"Whose…? mine, yours",vi:"Hỏi đồ vật của ai và đại từ sở hữu",f:"Whose + danh từ + is this? → It's mine/yours/his/hers",ex:["Whose bag is this?|Cái cặp này của ai?","It's mine.|Nó là của tôi.","Is this pencil yours?|Bút chì này của bạn à?","No, it's hers.|Không, nó là của cô ấy.","Whose shoes are these?|Đôi giày này của ai?","They are his.|Chúng là của cậu ấy."]},
{lv:"M",t:"Could / Couldn't",vi:"Khả năng trong quá khứ và nhờ vả lịch sự",f:"Chủ ngữ + could / couldn't + động từ",ex:["I could swim when I was five.|Tôi biết bơi khi tôi năm tuổi.","She couldn't find her key.|Cô ấy không thể tìm thấy chìa khóa.","He could read when he was four.|Cậu ấy biết đọc khi bốn tuổi.","We couldn't play outside because it rained.|Chúng tôi không thể chơi ngoài trời vì trời mưa.","Could you help me, please?|Bạn có thể giúp tôi được không?","Could you open the window?|Bạn mở giúp cửa sổ được không?"]},
{lv:"M",t:"always, often, sometimes, never",vi:"Trạng từ chỉ tần suất",f:"Chủ ngữ + always/often/sometimes/never + động từ",ex:["I always have breakfast at seven.|Tôi luôn ăn sáng lúc bảy giờ.","She often goes to the library.|Cô ấy thường đến thư viện.","We sometimes eat noodles.|Thỉnh thoảng chúng tôi ăn mì.","He never drinks coffee.|Cậu ấy không bao giờ uống cà phê.","How often do you play tennis?|Bạn chơi quần vợt bao lâu một lần?","I play tennis once a week.|Tôi chơi quần vợt mỗi tuần một lần."]},
{lv:"M",t:"Shall we…? Rủ rê",vi:"Đưa ra gợi ý và trả lời",f:"Shall we + V? · What about + V-ing? · Why don't we + V?",ex:["Shall we go to the cinema?|Chúng mình đi xem phim nhé?","That's a good idea!|Ý kiến hay đấy!","What about playing chess?|Chơi cờ vua thì sao?","Let's have a picnic.|Cùng đi dã ngoại nào.","Why don't we go swimming?|Sao chúng ta không đi bơi nhỉ?","Sorry, I can't.|Xin lỗi, tớ không đi được."]},
{lv:"M",t:"Hỏi và chỉ đường",vi:"Hỏi đường và chỉ hướng đi",f:"Where is …? · Go straight on · Turn left/right",ex:["Excuse me, where is the bank?|Xin lỗi, ngân hàng ở đâu ạ?","Go straight on.|Đi thẳng.","Turn left at the corner.|Rẽ trái ở góc đường.","Turn right and it's on your left.|Rẽ phải và nó ở bên tay trái bạn.","The café is opposite the cinema.|Quán cà phê ở đối diện rạp chiếu phim.","It's between the bank and the library.|Nó ở giữa ngân hàng và thư viện."]},
{lv:"M",t:"Giờ giấc & thói quen hằng ngày",vi:"Nói giờ và các việc làm mỗi ngày",f:"What time do you …? → I … at + giờ",ex:["What time do you get up?|Bạn thức dậy lúc mấy giờ?","I get up at half past six.|Tôi thức dậy lúc sáu giờ rưỡi.","I go to school at seven o'clock.|Tôi đi học lúc bảy giờ.","She has lunch at twelve.|Cô ấy ăn trưa lúc mười hai giờ.","On Saturdays I play football.|Vào thứ Bảy tôi chơi bóng đá.","I go to bed at nine o'clock.|Tôi đi ngủ lúc chín giờ."]},
{lv:"M",t:"Can I…? May I…?",vi:"Xin phép một cách lịch sự",f:"Can I / May I + động từ …?",ex:["Can I open the window?|Tôi mở cửa sổ được không?","May I come in?|Em vào lớp được không ạ?","Can I borrow your rubber?|Tớ mượn cục tẩy nhé?","Of course!|Tất nhiên rồi!","Sorry, you can't.|Xin lỗi, không được.","May I go to the toilet, please?|Em xin phép đi vệ sinh ạ?"]},
{lv:"M",t:"some / any · How much / How many",vi:"Danh từ đếm được và không đếm được",f:"some (câu khẳng định) · any (phủ định, câu hỏi)",ex:["Is there any milk?|Có sữa không?","There is some bread.|Có một ít bánh mì.","There aren't any eggs.|Không còn quả trứng nào.","Would you like some tea?|Bạn có muốn uống trà không?","How much water do you drink?|Bạn uống bao nhiêu nước?","How many sweets have you got?|Bạn có bao nhiêu cái kẹo?"]},

{lv:"F",t:"Be going to",vi:"Nói về kế hoạch và dự định",f:"Chủ ngữ + am/is/are going to + động từ",ex:["I'm going to visit my uncle.|Tôi sẽ đi thăm chú.","We are going to have a party.|Chúng tôi sẽ tổ chức một bữa tiệc.","What are you going to do tomorrow?|Ngày mai bạn định làm gì?","She is going to be a scientist.|Cô ấy sẽ trở thành nhà khoa học.","It's going to rain.|Trời sắp mưa rồi.","They aren't going to play tennis.|Họ sẽ không chơi quần vợt."]},
{lv:"F",t:"Will / Won't",vi:"Dự đoán tương lai và lời hứa",f:"Chủ ngữ + will / won't + động từ",ex:["I think it will be sunny tomorrow.|Tôi nghĩ ngày mai trời sẽ nắng.","People will live on the moon.|Con người sẽ sống trên mặt trăng.","Will you help me?|Bạn sẽ giúp tôi chứ?","I won't forget your birthday.|Tôi sẽ không quên sinh nhật bạn.","Robots will clean our houses.|Người máy sẽ dọn dẹp nhà cửa của chúng ta.","I'll call you later.|Tôi sẽ gọi cho bạn sau."]},
{lv:"F",t:"Have you ever…?",vi:"Thì hiện tại hoàn thành: trải nghiệm và việc vừa xong",f:"have/has + V3 (been, seen, finished…)",ex:["Have you ever been to Hanoi?|Bạn đã bao giờ đến Hà Nội chưa?","Yes, I have.|Rồi, tôi đến rồi.","I have never seen a camel.|Tôi chưa bao giờ nhìn thấy lạc đà.","She has just finished her homework.|Cô ấy vừa làm xong bài tập.","Have you finished yet?|Bạn đã xong chưa?","We have already eaten lunch.|Chúng tôi đã ăn trưa rồi."]},
{lv:"F",t:"Quá khứ tiếp diễn: was doing",vi:"Hành động đang diễn ra tại một thời điểm trong quá khứ",f:"Chủ ngữ + was/were + V-ing",ex:["I was reading when the phone rang.|Tôi đang đọc sách thì điện thoại reo.","What were you doing at eight o'clock?|Lúc tám giờ bạn đang làm gì?","They were playing in the garden.|Họ đang chơi trong vườn.","It was raining all day.|Trời đã mưa cả ngày.","She was cooking dinner.|Cô ấy đang nấu bữa tối.","We weren't watching TV.|Chúng tôi đã không xem ti vi."]},
{lv:"F",t:"Should / Shouldn't",vi:"Đưa ra lời khuyên",f:"Chủ ngữ + should / shouldn't + động từ",ex:["You should eat more fruit.|Bạn nên ăn nhiều trái cây hơn.","You shouldn't stay up late.|Bạn không nên thức khuya.","Should I bring an umbrella?|Tôi có nên mang ô không?","We should help our friends.|Chúng ta nên giúp đỡ bạn bè.","He should go to the dentist.|Cậu ấy nên đi khám nha sĩ.","You should wear a coat.|Bạn nên mặc áo khoác."]},
{lv:"F",t:"Câu điều kiện: If…",vi:"Nếu … thì …",f:"If + hiện tại đơn, chủ ngữ + will + động từ",ex:["If it rains, we will stay at home.|Nếu trời mưa, chúng tôi sẽ ở nhà.","If you study hard, you will pass the test.|Nếu bạn học chăm, bạn sẽ qua bài kiểm tra.","If I'm hungry, I eat an apple.|Nếu tôi đói, tôi ăn một quả táo.","What will you do if it snows?|Bạn sẽ làm gì nếu trời có tuyết?","If you heat ice, it melts.|Nếu làm nóng băng, nó sẽ tan.","If she is late, she will take a taxi.|Nếu cô ấy bị muộn, cô ấy sẽ đi taxi."]},
{lv:"F",t:"Câu hỏi đuôi: isn't it?",vi:"Hỏi lại để xác nhận",f:"Câu khẳng định, + trợ động từ phủ định + đại từ?",ex:["It's a lovely day, isn't it?|Hôm nay đẹp trời nhỉ?","You like chocolate, don't you?|Bạn thích sô-cô-la, phải không?","She can swim, can't she?|Cô ấy biết bơi, phải không?","They aren't here, are they?|Họ không có ở đây, phải không?","He went home, didn't he?|Cậu ấy đã về nhà rồi, phải không?","This is your book, isn't it?|Đây là sách của bạn, phải không?"]},
{lv:"F",t:"who / which / where",vi:"Mệnh đề quan hệ để định nghĩa người, vật, nơi chốn",f:"người + who … · vật + which … · nơi + where …",ex:["A pilot is a person who flies planes.|Phi công là người lái máy bay.","This is the book which I bought yesterday.|Đây là quyển sách mà tôi đã mua hôm qua.","That's the park where we play football.|Đó là công viên nơi chúng tôi chơi bóng đá.","The girl who is singing is my cousin.|Cô bé đang hát là em họ tôi.","A fridge is a thing which keeps food cold.|Tủ lạnh là thứ giữ cho đồ ăn lạnh.","A library is a place where you can borrow books.|Thư viện là nơi bạn có thể mượn sách."]},
{lv:"F",t:"made of / used for",vi:"Nói đồ vật làm bằng gì và dùng để làm gì",f:"be made of + chất liệu · be used for + V-ing",ex:["This bag is made of paper.|Cái túi này làm bằng giấy.","What is it made of?|Nó được làm bằng gì?","A knife is used for cutting.|Con dao được dùng để cắt.","Scissors are used for cutting paper.|Kéo được dùng để cắt giấy.","The ring is made of gold.|Chiếc nhẫn được làm bằng vàng.","A camera is used for taking photos.|Máy ảnh được dùng để chụp ảnh."]},
{lv:"F",t:"too / enough",vi:"Quá … / đủ …",f:"too + tính từ · tính từ + enough · enough + danh từ",ex:["This box is too heavy.|Cái hộp này nặng quá.","I'm not tall enough.|Tôi không đủ cao.","The soup is too hot to eat.|Súp nóng quá không ăn được.","Is the water warm enough?|Nước đủ ấm chưa?","He is too young to drive.|Cậu ấy còn quá nhỏ để lái xe.","We have got enough chairs.|Chúng ta có đủ ghế rồi."]}
];

<script>
"use strict";
/* ============ Tiện ích ============ */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,a,...kids){const e=document.createElement(tag);for(const [k,v] of Object.entries(a||{})){if(v===false||v==null)continue;if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='html')e.innerHTML=v;else if(k==='style')e.style.cssText=v;else e.setAttribute(k,v===true?'':v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const rnd=a=>a[Math.random()*a.length|0];
function toast(msg){const t=h('div',{class:'toast',role:'status'},msg);document.body.append(t);setTimeout(()=>t.remove(),2200)}

/* ============ Dữ liệu ============ */
const LVN={S:'Starters',M:'Movers',F:'Flyers'};
const ALLWORDS=[],ALLSENTS=[];
const parseSent=s=>{const i=s.indexOf('|');return{en:s.slice(0,i).trim(),vi:s.slice(i+1).trim()}};
TOPICS.forEach(t=>{
  t.words={};t.all=[];
  ['S','M','F'].forEach(lv=>{
    t.words[lv]=(t[lv]||'').split(';').map(x=>x.trim()).filter(Boolean).map(x=>{const p=x.split('|');return{en:p[0].trim(),vi:(p[1]||'').trim(),em:(p[2]||t.icon).trim(),lv,tp:t}});
    t.all.push(...t.words[lv]);ALLWORDS.push(...t.words[lv]);
  });
  t.sents=(t.sen||[]).map(parseSent);ALLSENTS.push(...t.sents);
});
GRAMMAR.forEach(g=>{g.sents=g.ex.map(parseSent);ALLSENTS.push(...g.sents)});
const GTOPIC={id:'grammar',vi:'Mẫu câu',icon:'💬',all:[],sents:[]};

const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function pickSents(t,words,i){
  const has=s=>words.some(w=>new RegExp('\\b'+esc(w.en)+'\\b','i').test(s.en));
  const first=t.sents.filter(has);
  const rest=t.sents.filter(s=>!has(s));
  const rot=rest.length?rest.slice((i*3)%rest.length).concat(rest.slice(0,(i*3)%rest.length)):[];
  return first.concat(rot).slice(0,5);
}
const LESSONS=[];
['S','M','F'].forEach(lv=>{
  const V=[];
  TOPICS.forEach(t=>{
    const ws=t.words[lv];if(!ws.length)return;
    const ch=[];for(let i=0;i<ws.length;i+=6)ch.push(ws.slice(i,i+6));
    if(ch.length>1&&ch[ch.length-1].length<4){const last=ch.pop();ch[ch.length-1]=ch[ch.length-1].concat(last)}
    ch.forEach((c,i)=>V.push({id:`${t.id}.${lv}.${i+1}`,kind:'vocab',lv,tp:t,title:ch.length>1?`${t.vi} ${i+1}`:t.vi,words:c,sents:pickSents(t,c,i)}));
    if(ch.length>1)V.push({id:`${t.id}.${lv}.r`,kind:'review',lv,tp:t,title:`Ôn tập: ${t.vi}`,words:ws,sents:t.sents});
  });
  const G=GRAMMAR.filter(g=>g.lv===lv).map((g,i)=>({id:`g.${lv}.${i+1}`,kind:'grammar',lv,tp:GTOPIC,title:g.t,vi:g.vi,f:g.f,words:[],sents:g.sents}));
  const step=Math.max(1,Math.ceil(V.length/(G.length+1)));
  let gi=0;V.forEach((l,i)=>{LESSONS.push(l);if((i+1)%step===0&&gi<G.length)LESSONS.push(G[gi++])});
  while(gi<G.length)LESSONS.push(G[gi++]);
});
LESSONS.forEach((l,i)=>l.n=i+1);
const byId=Object.fromEntries(LESSONS.map(l=>[l.id,l]));

/* ============ Lưu tiến độ ============ */
let P={xp:0,games:{},streak:0,last:'',played:0,rate:0.9,voice:'',spoken:0};
try{Object.assign(P,JSON.parse(localStorage.getItem('vuihoc-movers')||'{}'))}catch(e){}
function saveP(){try{localStorage.setItem('vuihoc-movers',JSON.stringify(P))}catch(e){}updStats()}
function updStats(){$('#xp').textContent=P.xp;$('#streak').textContent=P.streak}
const dayStr=d=>d.toISOString().slice(0,10);
function touchStreak(){const t=dayStr(new Date());if(P.last===t)return;const y=dayStr(new Date(Date.now()-864e5));P.streak=P.last===y?P.streak+1:1;P.last=t}
function lessonStars(l){const g=P.games[l.id]||{};const n=Object.values(g).filter(s=>s>=2).length;return n>=7?3:n>=4?2:n>=2?1:0}
const starStr=(n,max=3)=>'⭐'.repeat(n)+'<span class="star-off">'+'⭐'.repeat(max-n)+'</span>';

/* ============ Âm thanh ============ */
let AC;
function tone(fs,dur=.12,type='sine',vol=.22){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;fs.forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.03);t+=dur*.8})}catch(e){}}
const sfx={ok:()=>tone([660,990],.12),bad:()=>tone([240,170],.2,'triangle',.25),win:()=>tone([523,659,784,1047],.15),pop:()=>tone([880],.06)};

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(){if(P.voice){const v=voices.find(v=>v.name===P.voice);if(v)return v}
  return voices.find(v=>/Google US English/i.test(v.name))||voices.find(v=>/(Aria|Jenny|Samantha|Zira)/i.test(v.name))||voices.find(v=>/en-US/i.test(v.lang))||voices.find(v=>/en-GB/i.test(v.lang))||voices[0]}
function say(text,rate){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';const v=pickVoice();if(v)u.voice=v;u.rate=rate||P.rate;setTimeout(()=>speechSynthesis.speak(u),40)}catch(e){}}

/* ============ Ghi âm & chấm phát âm ============ */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const ONES='zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen'.split(' ');
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function n2w(n){if(n<20)return ONES[n];if(n<100)return TENS[n/10|0]+(n%10?' '+ONES[n%10]:'');if(n<1000)return ONES[n/100|0]+' hundred'+(n%100?' '+n2w(n%100):'');if(n===1000)return 'one thousand';return String(n)}
function norm(s){return String(s).toLowerCase().replace(/\d+(st|nd|rd|th)?/g,m=>n2w(parseInt(m,10))).replace(/[’‘`]/g,"'").replace(/-/g,' ').replace(/[^a-z' ]+/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function sim(a,b){a=norm(a);b=norm(b);if(!a&&!b)return 1;if(!a||!b)return 0;return 1-lev(a,b)/Math.max(a.length,b.length)}

async function startRecording(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)throw new Error('norec');
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mr=new MediaRecorder(stream);const chunks=[];
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};mr.start();
  return{stop:()=>new Promise(res=>{const fin=()=>{stream.getTracks().forEach(t=>t.stop());res(new Blob(chunks,{type:mr.mimeType||'audio/webm'}))};if(mr.state==='inactive')return fin();mr.onstop=fin;mr.stop()})};
}

const RecDB={db:null,mem:[],
  open(){return new Promise(res=>{if(this.db)return res(this.db);try{const r=indexedDB.open('vuihoc-rec',1);r.onupgradeneeded=()=>r.result.createObjectStore('rec',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>res(null)}catch(e){res(null)}})},
  async put(o){const db=await this.open();if(!db){this.mem.push(o);return}return new Promise(res=>{const tx=db.transaction('rec','readwrite');tx.objectStore('rec').put(o);tx.oncomplete=res;tx.onerror=res})},
  async all(){const db=await this.open();if(!db)return[...this.mem];return new Promise(res=>{const r=db.transaction('rec').objectStore('rec').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([])})},
  async del(id){const db=await this.open();if(!db){this.mem=this.mem.filter(x=>x.id!==id);return}return new Promise(res=>{const tx=db.transaction('rec','readwrite');tx.objectStore('rec').delete(id);tx.oncomplete=res;tx.onerror=res})}
};

function micWidget(textOrFn,onResult){
  const getText=()=>typeof textOrFn==='function'?textOrFn():textOrFn;
  const res=h('div',{class:'mic-res'},SR?'Bấm 🎤 rồi đọc to. Máy sẽ chấm điểm phát âm.':'Bấm 🎤 để ghi âm giọng đọc của em.');
  const micBtn=h('button',{class:'btn mic-btn'},'🎤 Bấm để nói');
  const playBtn=h('button',{class:'btn small ghost',hidden:true},'▶️ Nghe giọng em');
  const saveBtn=h('button',{class:'btn small ghost',hidden:true},'💾 Lưu vào Phòng thu');
  let blob=null,url=null,active=null,lastScore=null,recText='';
  playBtn.onclick=()=>{if(url)new Audio(url).play()};
  saveBtn.onclick=async()=>{if(!blob)return;await RecDB.put({id:String(Date.now()),text:recText,blob,date:Date.now(),score:lastScore});saveBtn.textContent='✔ Đã lưu';saveBtn.disabled=true;toast('Đã lưu vào Phòng thu âm')};
  const selfCheck=()=>{res.innerHTML='';res.append(h('div',{},'Nghe lại giọng em rồi tự chấm nhé:'),h('div',{class:'row center',style:'margin-top:6px'},
    h('button',{class:'btn small',onclick:()=>{lastScore=3;res.innerHTML='<span class="st">⭐⭐⭐</span>Tuyệt vời!';sfx.ok();onResult&&onResult(3)}},'👍 Em đọc tốt'),
    h('button',{class:'btn small',onclick:()=>{lastScore=2;res.innerHTML='<span class="st">⭐⭐</span>Khá lắm, luyện thêm nhé!';onResult&&onResult(2)}},'🙂 Tạm được'),
    h('button',{class:'btn small ghost',onclick:()=>say(getText())},'🔊 Nghe mẫu')))};
  micBtn.onclick=async()=>{
    if(active){active.stop();return}
    recText=getText();if(!recText.trim()){toast('Hãy nhập từ hoặc câu cần luyện');return}
    try{speechSynthesis.cancel()}catch(e){}
    res.textContent='Đang mở micro...';
    let rec=null;try{rec=await startRecording()}catch(e){rec=null}
    if(!rec&&!SR){res.textContent='Không mở được micro. Hãy cho phép trình duyệt dùng micro rồi thử lại.';return}
    micBtn.classList.add('on');micBtn.textContent='⏹ Đang nghe... bấm để dừng';res.textContent='Em đọc: "'+recText+'"';
    const finishRec=async()=>{if(rec){blob=await rec.stop();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);playBtn.hidden=false;saveBtn.hidden=false;saveBtn.disabled=false;saveBtn.textContent='💾 Lưu vào Phòng thu'}micBtn.classList.remove('on');micBtn.textContent='🎤 Nói lại';active=null};
    if(SR){
      const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=5;let got=null;
      r.onresult=e=>{got=[...e.results[0]].map(a=>a.transcript)};
      r.onerror=e=>{if(!got)got={err:e.error}};
      r.onend=async()=>{await finishRec();show(got)};
      active={stop:()=>{try{r.stop()}catch(e){}}};
      try{r.start()}catch(e){await finishRec();if(blob)selfCheck()}
    }else{
      active={stop:async()=>{await finishRec();selfCheck()}};
      setTimeout(()=>{if(active)active.stop()},8000);
    }
  };
  function show(got){
    if(!got||got.err){
      const e=got&&got.err;
      if(e==='network'||e==='not-allowed'||e==='service-not-allowed'||e==='audio-capture'){
        res.innerHTML='';res.append(h('div',{},e==='network'?'Chấm điểm giọng nói cần có Internet.':'Trình duyệt chưa cho dùng nhận dạng giọng nói.'));
        if(blob)selfCheck();
      }else res.textContent='Máy chưa nghe thấy gì. Em nói to và rõ hơn nhé!';
      return;
    }
    const text=recText;let best=0,heard=got[0]||'';
    got.forEach(g=>{const s=sim(g,text);if(s>best){best=s;heard=g}});
    const st=best>=.85?3:best>=.65?2:best>=.4?1:0;lastScore=st;
    P.spoken=(P.spoken||0)+1;saveP();
    const msg=st===3?'Xuất sắc! Phát âm rất chuẩn.':st===2?'Tốt lắm! Gần đúng rồi.':st===1?'Cố lên! Nghe mẫu rồi đọc lại nhé.':'Chưa đúng. Nghe mẫu và thử lại nhé!';
    res.innerHTML='';res.append(h('span',{class:'st',html:st?'⭐'.repeat(st):'💪'}),h('div',{},msg),h('small',{},'Máy nghe được: “'+heard+'” · '+Math.round(best*100)+'%'));
    st>=2?sfx.ok():sfx.bad();onResult&&onResult(st);
  }
  return h('div',{class:'mic'},h('div',{class:'row center'},micBtn,playBtn,saveBtn),res);
}

    h('div',{class:'num'},h('span',{},'Bài '+l.n+' · '+kindTxt),h('span',{class:'lv lv-'+l.lv},LVN[l.lv])),

        h('button',{class:'btn small ghost',onclick:async()=>{await RecDB.del(r.id);drawRecs()}},'🗑️ Xóa')))});

  const done=LESSONS.filter(l=>lessonStars(l)>0).length;
  const stars=LESSONS.reduce((s,l)=>s+lessonStars(l),0);
  const learned=new Set();LESSONS.forEach(l=>{if(Object.keys(P.games[l.id]||{}).length)l.words.forEach(w=>learned.add(w.en))});
  body.append(h('div',{class:'panel'},h('h2',{},'📊 Tiến độ của em'),h('div',{class:'statgrid'},
    [['⭐',P.xp,'điểm XP'],['🔥',P.streak,'ngày liên tiếp'],['📚',done+'/'+LESSONS.length,'bài đã xong'],['🌟',stars,'sao bài học'],['🔤',learned.size,'từ đã luyện'],['🎮',P.played,'lượt chơi'],['🎤',P.spoken||0,'lần luyện nói']]
    .map(([e,v,t])=>h('div',{class:'sbox'},h('span',{},e),h('b',{},String(v)),h('span',{},t))))));
  const B=[['🐣','Lượt chơi đầu tiên',P.played>=1],['🎯','Chơi 20 lượt',P.played>=20],['🚀','Chơi 100 lượt',P.played>=100],['📗','Xong 10 bài',done>=10],['📘','Xong 50 bài',done>=50],['🏅','Xong 100 bài',done>=100],['👑','Xong 200 bài',done>=200],['🔥','Học 3 ngày liền',P.streak>=3],['🌈','Học 7 ngày liền',P.streak>=7],['🎤','Nói 20 lần',(P.spoken||0)>=20],['💎','1000 XP',P.xp>=1000],['🦉','300 từ đã luyện',learned.size>=300]];
  body.append(h('div',{class:'panel'},h('h2',{},'🏆 Huy hiệu'),h('div',{class:'badges'},B.map(([e,t,ok])=>h('div',{class:'badge'+(ok?'':' lock')},h('span',{class:'e'},e),t)))));

      b.onclick=()=>{if(over)return;if(o===w){over=true;b.classList.add('pop');sfx.ok();say(w.en);done(wrong===0,900)}else{b.classList.add('bad');sfx.bad();wrong++}};
      b.addEventListener('animationend',e=>{if(e.animationName==='rise'){b.remove();if(!over)spawn(o,200)}});field.append(b)},delay);
    opts.forEach((o,k)=>spawn(o,k*700));
    ctx.area.append(h('div',{class:'prompt',style:'margin-bottom:8px'},h('div',{class:'row center'},h('span',{class:'em',style:'font-size:2.6rem'},w.em),h('span',{class:'vi'},w.vi)),h('small',{class:'hint',style:'margin:0'},'Chạm vào bong bóng có từ tiếng Anh đúng!')),field);
  });
}
function gWhack(ctx){
  rounds(ctx,ctx.words.slice(0,8),(w,done)=>{
    const opts=wordOpts(ctx,w,5);const holes=Array.from({length:9},()=>h('div',{class:'hole'}));let over=false,wrong=0;
    const pop=()=>{if(over)return;const free=holes.filter(x=>!x.firstChild);if(!free.length)return;const hole=rnd(free);const o=Math.random()<.4?w:rnd(opts);
      const m=h('button',{class:'mole'},o.en);hole.append(m);requestAnimationFrame(()=>m.classList.add('up'));
      m.onclick=()=>{if(over||m.dataset.hit)return;m.dataset.hit='1';if(o===w){over=true;m.classList.add('hit');sfx.ok();done(wrong===0,800)}else{m.classList.add('miss');sfx.bad();wrong++}};
      ctx.later(()=>{m.classList.remove('up');ctx.later(()=>m.remove(),220)},1500)};
    ctx.every(()=>{if(!over)pop()},750);pop();
    ctx.later(()=>{if(!over){over=true;sfx.bad();done(false,300)}},14000);
    ctx.area.append(h('div',{class:'prompt'},h('div',{class:'row center'},speakerBtn(w.en),h('span',{class:'vi'},w.em+' '+w.vi)),h('small',{class:'hint',style:'margin:0'},'Đập vào chú chuột mang từ em vừa nghe!')),h('div',{class:'holes'},holes));

}
function gApple(ctx){
  const items=ctx.words.filter(w=>letters(w.en).length>=3).slice(0,5);
  rounds(ctx,items,(w,done)=>{
    const target=w.en.toUpperCase();const need=new Set(letters(w.en));const got=new Set();let lives=6,over=false;
    const tree=h('div',{class:'tree','aria-label':'Số táo còn lại'}),word=h('div',{class:'mword'}),fb=fbLine(),kb=h('div',{class:'kb'});
    const drawTree=(fallIdx)=>{tree.innerHTML='🌳 ';for(let i=0;i<6;i++){if(i<lives)tree.append(h('span',{},'🍎'));else if(i===fallIdx)tree.append(h('span',{class:'fall'},'🍎'))}};
    const drawWord=(all)=>{word.textContent=[...target].map(c=>/[A-Z]/.test(c)?(all||got.has(c)?c:'_'):c).join(' ')};
    'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(ch=>{const k=h('button',{class:'key'},ch);k.onclick=()=>{if(over)return;k.disabled=true;
      if(need.has(ch)){got.add(ch);k.classList.add('good');sfx.pop();drawWord();if([...need].every(c=>got.has(c))){over=true;sfx.ok();setFb(fb,true);say(w.en);done(true,1200)}}
      else{lives--;sfx.bad();drawTree(lives);if(lives<=0){over=true;drawWord(true);setFb(fb,false,'Hết táo rồi! Từ đúng là: '+w.en);say(w.en);done(false,2000)}}};kb.append(k)});
    drawTree();drawWord();
    ctx.area.append(h('div',{class:'prompt'},h('div',{class:'row center'},h('span',{class:'em',style:'font-size:2.6rem'},w.em),h('span',{class:'vi'},w.vi))),tree,word,kb,fb);
  });
}
function gSearch(ctx){
  const ws=ctx.words.filter(w=>{const c=letters(w.en);return c.length>=2&&c.length<=9}).slice(0,6);
  const longest=Math.max(...ws.map(w=>letters(w.en).length),6);const N=Math.min(10,Math.max(8,longest+1));
  const G=Array.from({length:N},()=>Array(N).fill(null));const placed=[];const dirs=[[0,1],[1,0],[1,1]];
  ws.forEach(w=>{const s=letters(w.en);for(let t=0;t<300;t++){const [dr,dc]=rnd(dirs);const r=Math.random()*(N-(dr?s.length-1:0))|0,c=Math.random()*(N-(dc?s.length-1:0))|0;
    let ok=true;for(let k=0;k<s.length;k++){const x=G[r+dr*k][c+dc*k];if(x&&x!==s[k]){ok=false;break}}
    if(ok){const cells=[];for(let k=0;k<s.length;k++){G[r+dr*k][c+dc*k]=s[k];cells.push((r+dr*k)*N+c+dc*k)}placed.push({w,s,cells,found:false});break}}});
  const AZ='ABCDEFGHIKLMNOPRSTUWY';for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!G[r][c])G[r][c]=rnd(AZ);
  const grid=h('div',{class:'wsgrid',style:`grid-template-columns:repeat(${N},auto)`});const cellEls=[];let start=null,foundN=0;
  const list=h('div',{class:'wslist'},placed.map(p=>{p.li=h('div',{},p.w.em+' '+p.w.en);return p.li}));
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const i=r*N+c;const b=h('button',{class:'wscell'},G[r][c]);cellEls.push(b);
    b.onclick=()=>{if(start==null){start=i;b.classList.add('sel');return}
      const r0=start/N|0,c0=start%N;let dr=Math.sign(r-r0),dc=Math.sign(c-c0);const len=Math.max(Math.abs(r-r0),Math.abs(c-c0))+1;
      const straight=(r===r0||c===c0||Math.abs(r-r0)===Math.abs(c-c0));cellEls[start].classList.remove('sel');
      if(straight&&start!==i){const path=[];for(let k=0;k<len;k++)path.push((r0+dr*k)*N+c0+dc*k);const key=path.join(',');const rkey=[...path].reverse().join(',');
        const p=placed.find(p=>!p.found&&(p.cells.join(',')===key||p.cells.join(',')===rkey));
        if(p){p.found=true;foundN++;p.cells.forEach(k=>cellEls[k].classList.add('found'));p.li.classList.add('found');sfx.ok();say(p.w.en);ctx.score(foundN);ctx.progress(foundN,placed.length);
          if(foundN===placed.length)ctx.later(()=>ctx.finish(foundN,placed.length),900)}else sfx.bad()}
      start=null}}
  ctx.area.append(h('p',{class:'hint'},'Chạm chữ cái đầu rồi chạm chữ cái cuối của từ (ngang, dọc hoặc chéo).'),
    h('div',{class:'wsbox'},grid,h('div',{},list,h('button',{class:'btn small ghost',style:'margin-top:12px',onclick:()=>{placed.forEach(p=>{if(!p.found)p.cells.forEach(k=>cellEls[k].classList.add('sel'))});ctx.later(()=>ctx.finish(foundN,placed.length),1800)}},'🏳️ Xem đáp án'))));
}
function gMystery(ctx){
  const items=ctx.words.filter(w=>w.em!==ctx.lesson.tp.icon&&!/^[0-9A-Za-z]/.test(w.em)).slice(0,8);
  const list=items.length>=3?items:ctx.words.slice(0,8);
  rounds(ctx,list,(w,done)=>{let blur=26;const pic=h('div',{class:'mystery',style:`filter:blur(${blur}px)`},w.em);const fb=fbLine();
    ctx.every(()=>{blur=Math.max(0,blur-.6);pic.style.filter=`blur(${blur}px)`},100);
    ctx.area.append(h('p',{class:'hint'},'Hình gì đang hiện ra? Đoán càng sớm càng giỏi!'),pic,
      choiceGrid(wordOpts(ctx,w,4,true),o=>o.en,o=>o===w,ok=>{blur=0;pic.style.filter='none';setFb(fb,ok,ok?null:'Đó là: '+w.en+' – '+w.vi);say(w.en);done(ok)}),fb)});
}
function gSpeed(ctx){
  const pool=ctx.lesson.words;let score=0,tries=0,left=60;const timer=h('div',{class:'big',style:'font:800 2rem var(--f-display);text-align:center'},'60');const q=h('div');
  ctx.area.append(timer,q);
  ctx.every(()=>{left--;timer.textContent=left;ctx.progress(60-left,60);if(left<=0)ctx.finish(score,Math.max(tries,1),score>=15?3:score>=10?2:score>=5?1:0)},1000);
  const ask=()=>{if(!ctx.alive)return;q.innerHTML='';const w=rnd(pool);const t=Math.random()<.5;
    q.append(h('div',{class:'prompt'},t?h('div',{class:'big'},w.en):h('div',{class:'row center'},h('span',{class:'em'},w.em),h('span',{class:'vi'},w.vi))),
      choiceGrid(wordOpts(ctx,w),o=>t?o.vi:o.en,o=>o===w,ok=>{tries++;if(ok)score++;ctx.score(score);ctx.later(ask,ok?250:800)}))};
  ask();
}

/* ============ Trò chơi câu ============ */
const toks=s=>s.en.replace(/[.?!]+$/,'').split(/\s+/);
const endP=s=>(s.en.match(/[.?!]+$/)||[''])[0];
const cleanTok=t=>t.replace(/[,.!?]+$/,'');
function chipGame(ctx,s,extras,showVi,done){
  const target=toks(s);const chips=shuffle(target.concat(extras).map((t,i)=>({t,i})));
  if(!extras.length&&chips.map(c=>c.t).join(' ')===target.join(' ')&&chips.length>1)chips.push(chips.shift());
  const ans=h('div',{class:'answer'}),bank=h('div',{class:'tiles'}),fb=fbLine();const picked=[];let over=false;
  const els=chips.map(c=>{const b=h('button',{class:'tile w'},c.t);b.onclick=()=>{if(over)return;picked.push(c);b.classList.add('used');sfx.pop();drawAns();if(!extras.length&&picked.length===target.length)check()};return b});
  function drawAns(){ans.innerHTML='';if(!picked.length)ans.append(h('span',{style:'color:var(--ink2)'},'Chạm các từ bên dưới để ghép câu'));
    picked.forEach((c,k)=>ans.append(h('button',{class:'tile w',onclick:()=>{if(over)return;picked.splice(k,1);els[chips.indexOf(c)].classList.remove('used');drawAns()}},c.t)))}
  function check(){if(over||!picked.length)return;over=true;const ok=picked.map(c=>c.t).join(' ')===target.join(' ');ans.classList.add(ok?'ok':'no');ok?sfx.ok():sfx.bad();setFb(fb,ok,ok?null:'Câu đúng: '+s.en);say(s.en);done(ok)}
  bank.append(...els);drawAns();
  ctx.area.append(h('div',{class:'prompt'},showVi?h('div',{class:'sen'},'🇻🇳 '+s.vi):h('div',{class:'vi'},s.vi),h('button',{class:'btn small ghost',onclick:()=>say(s.en)},'🔊 Nghe câu')),ans,bank,
    extras.length?h('div',{class:'row center',style:'margin-top:12px'},h('button',{class:'btn primary',onclick:check},'Kiểm tra')):null,fb);
}
function sScramble(ctx){rounds(ctx,ctx.sents.slice(0,6),(s,done)=>chipGame(ctx,s,[],false,done))}
function sBuild(ctx){rounds(ctx,ctx.sents.slice(0,6),(s,done)=>{
  const own=new Set(toks(s).map(t=>cleanTok(t).toLowerCase()));
  const ex=shuffle(ALLSENTS.filter(x=>x!==s).flatMap(toks).map(cleanTok).filter(t=>t.length>1&&!own.has(t.toLowerCase())));
  chipGame(ctx,s,[...new Set(ex)].slice(0,3),true,done)})}
const STOP=new Set('a an the is are am to in on of and my your i it be at do does did this that he she we they you'.split(' '));
function sFill(ctx){rounds(ctx,ctx.sents.slice(0,6),(s,done)=>{
  const T=toks(s);const lw=new Set(ctx.lesson.words.map(w=>w.en.toLowerCase()));
  let cand=T.map((t,i)=>i).filter(i=>lw.has(cleanTok(T[i]).toLowerCase()));
  if(!cand.length)cand=T.map((t,i)=>i).filter(i=>{const c=cleanTok(T[i]);return c.length>=3&&!STOP.has(c.toLowerCase())&&/^[A-Za-z']+$/.test(c)});
  if(!cand.length)cand=T.map((t,i)=>i);
  const k=rnd(cand);const ans=cleanTok(T[k]);const trail=T[k].slice(ans.length);
  const pool=[...new Set(ALLSENTS.flatMap(toks).map(cleanTok).filter(t=>/^[A-Za-z']+$/.test(t)&&t.length>=2&&t.toLowerCase()!==ans.toLowerCase()&&!STOP.has(t.toLowerCase())))];
  const opts=shuffle([ans,...sample(pool,3).map(t=>k===0?t[0].toUpperCase()+t.slice(1):t.toLowerCase())]);
  const line=h('div',{class:'sen',style:'text-align:center'});const draw=f=>{line.innerHTML='';T.forEach((t,i)=>{line.append(i===k?h('span',{class:'mword',style:'font-size:inherit;letter-spacing:0'},h('span',{class:'blank'},f||'_____'),trail):t,' ')});line.append(endP(s))};draw();
  const fb=fbLine();
  ctx.area.append(h('div',{class:'prompt'},line,h('div',{class:'vi'},s.vi)),choiceGrid(opts,o=>o,o=>o===ans,ok=>{draw(ans);setFb(fb,ok);say(s.en);done(ok)}),fb)})}
function sTrans(ctx){rounds(ctx,ctx.sents.slice(0,6),(s,done)=>{const fb=fbLine();
  ctx.area.append(h('div',{class:'prompt'},h('div',{class:'sen'},s.en),h('button',{class:'btn small ghost',onclick:()=>say(s.en)},'🔊 Nghe')),h('p',{class:'hint'},'Câu này nghĩa là gì?'),
    choiceGrid(sentOpts(ctx,s),o=>o.vi,o=>o===s,ok=>{setFb(fb,ok);done(ok)},'one sent'),fb);say(s.en)})}
function sListen(ctx){rounds(ctx,ctx.sents.slice(0,6),(s,done)=>{const fb=fbLine();
  ctx.area.append(h('div',{class:'prompt'},speakerBtn(s.en),h('div',{class:'row center'},h('button',{class:'btn small ghost',onclick:()=>say(s.en,.6)},'🐢 Nghe chậm')),h('div',{class:'vi'},'Em nghe được câu nào?')),
    choiceGrid(sentOpts(ctx,s),o=>o.en,o=>o===s,ok=>{setFb(fb,ok,ok?null:s.vi);done(ok)},'one sent'),fb);say(s.en)})}
function sHalves(ctx){
  const ss=shuffle(ctx.lesson.sents.filter(s=>toks(s).length>=4)).slice(0,5);
  const use=ss.length>=3?ss:shuffle(ctx.lesson.sents).slice(0,5);
  matchGame(ctx,use.map(s=>{const T=s.en.split(/\s+/);const m=Math.ceil(T.length/2);return{a:T.slice(0,m).join(' ')+' …',b:'… '+T.slice(m).join(' '),speak:s.en}}),'Nối đầu câu bên trái với phần cuối câu bên phải.');
}
function sDict(ctx){rounds(ctx,ctx.sents.slice(0,5),(s,done)=>{
  const inp=h('input',{type:'text',id:'dictIn',autocomplete:'off',spellcheck:'false',style:'font-size:1.15rem;width:100%;max-width:560px','aria-label':'Gõ câu em nghe được'});const fb=fbLine();let used=false;
  const check=()=>{if(used||!inp.value.trim())return;used=true;inp.disabled=true;const sc=sim(inp.value,s.en);const ok=sc>=.85;ok?sfx.ok():sfx.bad();setFb(fb,ok,(ok?'Đúng rồi! ':'Gần đúng '+Math.round(sc*100)+'% · ')+'Câu đúng: '+s.en);done(ok,ok?1200:2600)};
  inp.onkeydown=e=>{if(e.key==='Enter')check()};
  ctx.area.append(h('div',{class:'prompt'},speakerBtn(s.en),h('div',{class:'vi'},s.vi),h('small',{class:'hint',style:'margin:0'},'Gợi ý: câu có '+toks(s).length+' từ')),h('div',{class:'row center'},inp),
    h('div',{class:'row center',style:'margin-top:10px'},h('button',{class:'btn ghost small',onclick:()=>say(s.en,.55)},'🐢 Nghe chậm'),h('button',{class:'btn primary',onclick:check},'Kiểm tra')),fb);
  say(s.en);setTimeout(()=>inp.focus(),50)})}
function sSpeak(ctx){
  const ss=ctx.sents.slice(0,5);let i=0,total=0;
  const draw=()=>{ctx.area.innerHTML='';ctx.progress(i,ss.length);const s=ss[i];let got=0;
    ctx.area.append(h('div',{class:'prompt'},h('div',{class:'sen'},s.en),h('div',{class:'vi'},s.vi)),
      h('div',{class:'row center'},h('button',{class:'btn',onclick:()=>say(s.en)},'🔊 Nghe mẫu'),h('button',{class:'btn',onclick:()=>say(s.en,.55)},'🐢 Nghe chậm')),
      micWidget(s.en,st=>{got=Math.max(got,st);ctx.score(total+got)}),
      h('div',{class:'row center',style:'margin-top:14px'},h('button',{class:'btn primary',onclick:()=>{total+=got;i++;if(i>=ss.length)ctx.finish(total,ss.length*3);else draw()}},i<ss.length-1?'Câu tiếp theo →':'Hoàn thành 🎉')));
    say(s.en)};
  draw();
}
